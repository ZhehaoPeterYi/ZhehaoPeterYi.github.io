short_bio: >-
  <p>
    Hi! My name is <span style="color: #2b6cb0; font-weight: bold;">Zhehao Yi</span>. 
    I'm an Electrical Engineering Ph.D. student at <a href="https://www.stonybrook.edu" target="_blank" style="color: #990000; text-decoration: none;">Stony Brook University</a> (Go Seawolves!), 
    under <a href="https://yifanzhou.info/" target="_blank" style="color: #990000;">Prof. Yifan Zhou</a>'s guidance.  
    <br>
    Before I joined Stony Brook University, I finished my first year of Ph.D. study at the <a href="https://www.uah.edu" target="_blank" style="color: #0055a5;">University of Alabama in Huntsville</a> with <a href="https://rahulbhadani.github.io/" style="color: #0055a5;">Prof. Rahul Bhadani</a> in Computer Engineering. 
    <br>
    I did my bachelor's degree at <a href="http://www.scau.edu.cn" target="_blank" style="color: #006633;">South China Agricultural University</a>, majoring in Information and Computing Science. 
    My advisors are Prof. Yanying Liang, Prof. Haozhen Situ, and Prof. Lingxiang Zhu.
  </p>
  <p>
    I'm interested in quantum computing. 
    I mean anything related to quantum computing, no matter quantum communication, the variational quantum algorithm, the quantum approximate optimization algorithm, the quantum eigensolver, the power system, or any situation that can apply any quantum algorithms. 
    Quantum computing is such a wonderful subject, based on quantum mechanics, which gives us the superpower to use entanglement and superposition to overcome so many difficult tasks.  
    If you are also interested in quantum computing, please feel free to read my tutorial. 
  </p>

